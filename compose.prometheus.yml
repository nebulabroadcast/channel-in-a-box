services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus_data:/prometheus"
    networks:
      - nebula-box

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--no-collector.netdev", "--no-collector.netstat"]
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - nebula-box

volumes:
  prometheus_data: {}
