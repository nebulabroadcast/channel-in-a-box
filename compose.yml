services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - "POSTGRES_USER=nebula"
      - "POSTGRES_PASSWORD=nebula"
      - "POSTGRES_DB=nebula"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "db:/var/lib/postgresql"
    networks:
      - nebula-box

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebula-box

  loadbalancer:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "4455:4455" # plain HTTP (development)
      - "4443:4443" # HTTPS
    environment:
      - "NEBULA_HOST=${NEBULA_HOST:-localhost}"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      # keeps the internal CA, so you only trust it once
      - "caddy_data:/data"
    networks:
      - nebula-box

  setup:
    image: nebulabroadcast/nebula-server:dev
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["./manage", "setup"]
    volumes:
      - "./settings:/settings"
      - "./storage:/mnt/nebula_01"
    networks:
      - nebula-box

  server:
    image: nebulabroadcast/nebula-server:dev
    restart: unless-stopped
    expose:
      - 80
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: vip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    entrypoint: ["./manage", "serve"]

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "./plugins:/plugins"
      - "./settings:/settings"
      - "./storage:/mnt/nebula_01"
    environment:
      - "NEBULA_LOG_LEVEL=trace"
    networks:
      - nebula-box


  worker:
    image: nebulabroadcast/nebula-worker:dev
    hostname: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    networks:
      nebula-box:
        ipv4_address: 172.44.0.10
    volumes:
      - "./storage:/mnt/nebula_01"


  # Preview stream: CasparCG publishes over RTSP, mediamtx serves it
  # as HLS on http://localhost:8888/live and RTSP on rtsp://localhost:8554/live
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8888:8888" # HLS
      - "8554:8554" # RTSP
    volumes:
      - "./mediamtx.yml:/mediamtx.yml:ro"
    networks:
      - nebula-box

  casparcg:
    image: nebulabroadcast/casparcg:2.5.0
    ports:
      - 5250:5250
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./casparcg.config:/opt/casparcg/casparcg.config
      - ./storage:/storage
    depends_on:
      - mediamtx
    restart: unless-stopped
    networks:
      - nebula-box


#
# Docker stack setup
#

volumes:
  db: {}
  caddy_data: {}

# We need a static IP for the worker. predefined hosts for OSC messaging
# in CasparCG cannot use hostnames

networks:
  nebula-box:
    ipam:
      config:
        - subnet: 172.44.0.0/16
