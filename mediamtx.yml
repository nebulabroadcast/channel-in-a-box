# Minimal override - everything else falls back to mediamtx's built-in
# defaults (HLS on :8888, WebRTC on :8889/:8189, RTSP on :8554, etc).
#
# CasparCG pushes MPEG-TS over UDP; mediamtx just needs a path that listens
# for it. 0.0.0.0 = accept from any sender (both containers share the host's
# network namespace here, so caspar reaches this as 127.0.0.1:1234).
paths:
  live:
    source: udp+mpegts://0.0.0.0:1234
