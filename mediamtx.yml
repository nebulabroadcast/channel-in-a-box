# Minimal override - everything else falls back to mediamtx's built-in
# defaults (HLS on :8888, WebRTC on :8889/:8189, RTSP on :8554, etc).
#
# CasparCG publishes to rtsp://mediamtx:8554/live over TCP (see the
# <ffmpeg> consumer in casparcg.config); mediamtx just needs a path that
# accepts publishers. The stream is then available at http://localhost:8888/live
paths:
  live:
    source: publisher
